<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Kangaroo 备课站 (1999 G3-4 & 2002 G5-6)</title>
<script src="site_data.js"></script>
<script src="diagrams.js"></script>
<script src="hints.js"></script>
<style>
:root {
  --bg: #f8fafc;
  --surface: #ffffff;
  --text: #1f2937;
  --muted: #6b7280;
  --accent: #2563eb;
  --accent-light: #dbeafe;
  --danger: #dc2626;
  --danger-light: #fee2e2;
  --ok: #16a34a;
  --ok-light: #dcfce7;
  --warn: #d97706;
  --warn-light: #fef3c7;
  --border: #e5e7eb;
  --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
}
* { box-sizing: border-box; }
body {
  margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.6;
}
header {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 18px 24px; position: sticky; top: 0; z-index: 20;
  box-shadow: var(--shadow);
}
header h1 { margin: 0; font-size: 22px; display: flex; align-items: center; gap: 10px; }
header p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
.controls {
  display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
  padding: 16px 24px; background: var(--surface); border-bottom: 1px solid var(--border);
  position: sticky; top: 78px; z-index: 10;
}
.controls-row { width: 100%; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
select, input[type="text"], input[type="number"], button {
  font: inherit; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text);
}
button { cursor: pointer; transition: .15s; background: var(--accent-light); border-color: var(--accent); color: var(--accent); font-weight: 600; }
button:hover { background: var(--accent); color: #fff; }
button.secondary { background: var(--bg); border-color: var(--border); color: var(--text); }
button.secondary:hover { background: #eef2ff; color: var(--accent); }
button.danger { background: var(--danger-light); border-color: var(--danger); color: var(--danger); }
button.danger:hover { background: var(--danger); color: #fff; }
button.ok { background: var(--ok-light); border-color: var(--ok); color: var(--ok); }
button.ok:hover { background: var(--ok); color: #fff; }
main { padding: 24px; max-width: 1200px; margin: 0 auto; }
.tag-cloud { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; width: 100%; }
.tag-cloud.hidden { display: none; }
.tag-chip { padding: 5px 12px; border-radius: 16px; background: #f3f4f6; color: #374151; border: 1px solid var(--border); font-size: 13px; cursor: pointer; transition: .15s; user-select: none; }
.tag-chip:hover { background: #e5e7eb; }
.tag-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.tag-chip .count { margin-left: 4px; opacity: .75; font-size: 11px; }
.active-tags { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.active-tag { padding: 3px 10px; border-radius: 14px; background: var(--accent-light); color: var(--accent); font-size: 12px; font-weight: 600; }
.active-tag.none { background: #f3f4f6; color: var(--muted); font-weight: 400; }
.ans-hint { font-size: 13px; color: var(--muted); margin-left: auto; }
.view-ans { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 24px; box-shadow: var(--shadow); }
.ans-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 10px; margin-top: 12px; }
.ans-cell { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-radius: 8px; background: #f3f4f6; font-size: 14px; }
.ans-cell .q { color: var(--muted); }
.ans-cell .a { font-weight: bold; color: var(--accent); font-size: 16px; }
.q-list { display: grid; gap: 20px; }
.q-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; box-shadow: var(--shadow); }
.q-header { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.q-badge { padding: 3px 10px; border-radius: 20px; font-size: 13px; font-weight: 600; }
.q-points { background: var(--warn-light); color: var(--warn); }
.q-tag { background: #f3e8ff; color: #7e22ce; cursor: pointer; }
.q-tag:hover { background: #e9d5ff; }
.q-title { font-size: 18px; font-weight: 700; }
.q-text { font-size: 16px; margin: 10px 0; }
.options { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin: 14px 0; }
.option { border: 2px solid var(--border); border-radius: 10px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; cursor: pointer; transition: .15s; }
.option:hover { border-color: var(--accent); background: #f8fafc; }
.option .letter { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #f3f4f6; font-weight: 700; }
.option.correct { border-color: var(--ok); background: var(--ok-light); }
.option.correct .letter { background: var(--ok); color: #fff; }
.q-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.section { margin-top: 14px; padding: 14px; border-radius: 10px; background: #f8fafc; border: 1px solid var(--border); }
.section h4 { margin: 0 0 8px; font-size: 15px; color: var(--accent); }
.section.solution { background: #eff6ff; border-color: #bfdbfe; }
.section.methods { background: #f5f3ff; border-color: #ddd6fe; }
.section.diagram { background: #fffbeb; border-color: #fde68a; text-align: center; }
.section.tip { background: #f0fdf4; border-color: #bbf7d0; }
.section.tip h4 { color: var(--ok); }
.mk-diagram { max-width: 100%; height: auto; max-height: 260px; }
.empty { text-align: center; color: var(--muted); padding: 60px 20px; }
footer { text-align: center; color: var(--muted); padding: 30px; font-size: 13px; }
@media (max-width: 640px) {
  .controls { top: 0; position: relative; }
  .options { grid-template-columns: 1fr; }
}

html, body { height: 100%; }
body { height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
header, .controls { position: static; flex-shrink: 0; }
header { padding: 12px 24px; }
#modeToggle { float: right; margin-left: 12px; }
.controls { padding: 10px 24px; gap: 6px; max-height: 40dvh; overflow-y: auto; }
.controls-row:has(.tag-cloud.hidden) { display: none; }
main { width: 100%; flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 16px 24px; }
.q-list { display: grid; gap: 20px; }
.q-card { min-height: 0; }
footer { padding: 4px; font-size: 11px; }
button:disabled { opacity: .4; cursor: default; }
.option { background: white; color: var(--text); font-weight: 400; text-align: left; }
.option:hover { color: var(--text); }
.option.incorrect { border-color: var(--danger); background: var(--danger-light); }
.option.incorrect .letter { background: var(--danger); color: white; }
.feedback { min-height: 1.6em; font-weight: 600; }
.feedback.correct { color: var(--ok); }
.feedback.incorrect { color: var(--danger); }
.section.hint { background: #fffbeb; border-color: #fde68a; }
button:focus-visible, main:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (max-width: 640px) {
  header { padding: 8px 12px; } header h1 { font-size: 17px; } header p { font-size: 12px; }
  #modeToggle { font-size: 12px; padding: 6px; }
  .controls { padding: 8px 12px; } .controls-row { gap: 6px; }
  #search { width: 100%; } main { padding: 10px; } .q-card { padding: 14px; }
  footer { display: none; }
}
dialog { width: min(640px, 94vw); max-height: 85dvh; overflow: auto; border: 1px solid var(--border); border-radius: 14px; padding: 24px; }
dialog::backdrop { background: #0f172a80; }
.hint-field { margin: 16px 0; }
.hint-field textarea { display: block; width: 100%; min-height: 90px; resize: vertical; font: inherit; padding: 10px; border: 1px solid var(--border); border-radius: 8px; }
.hint li { white-space: pre-wrap; margin: 8px 0; }
#hintError { color: var(--danger); }
</style>
</head>
<body>
<header>
  <button id="modeToggle" class="secondary" aria-pressed="false">教学版 · 切换练习版</button><h1>🦘 Math Kangaroo 备课站</h1>
  <p>1999 · Grade 3–4 ｜ 2002 · Grade 5–6</p>
</header>

<div class="controls">
  <div class="controls-row">
    <select id="yearSel">
      <option value="all">全部试卷</option>
      <option value="1999">1999 年 · Grade 3–4</option>
      <option value="2002">2002 年 · Grade 5–6</option>
    </select>
    <select id="viewSel">
      <option value="list">全部题目</option>
      <option value="single">单题查看</option>
      <option value="answers">全卷答案</option>
    </select>
    <input type="number" id="singleNo" min="1" max="30" placeholder="题号" style="width:80px;display:none">
    <input type="text" id="search" placeholder="搜索题目内容/关键词/标签">
    <button id="btnToggleTags" class="secondary">标签筛选 ▼</button>
    <button id="btnToggleAns" class="ok">显示所有答案</button>
    <button id="btnExpandSol" class="secondary">展开全部详解</button>
  </div>
  <div class="controls-row" id="tagRow">
    <span id="activeTags" class="active-tags"><span class="active-tag none">未选标签</span></span>
    <span id="ansHint" class="ans-hint"></span>
  </div>
  <div class="controls-row">
    <div class="tag-cloud hidden" id="tagCloud"></div>
  </div>
</div>

<main id="app" tabindex="0" aria-label="题目浏览区"></main>
<dialog id="hintEditor" aria-labelledby="hintEditorTitle">
<form id="hintForm"><h2 id="hintEditorTitle">编辑 Hint</h2><p>按由浅到深排列。保存到当前浏览器，刷新后保留；不会同步到其他设备。</p>
<div id="hintFields"></div><button type="button" id="addHint">＋ 添加一条</button>
<p id="hintError" role="alert"></p><div class="q-actions"><button type="submit">保存 Hint</button><button type="button" id="cancelHints" class="secondary">取消</button></div></form>
</dialog>

<footer>
  Generated for lesson prep · Math Kangaroo 1999 (Grade 3–4) &amp; 2002 (Grade 5–6)
</footer>

<script>
const years = Object.keys(KANGAROO_DATA).sort();
const allTags = {};
years.forEach(y => KANGAROO_DATA[y].forEach(q => {
  (q.tags || []).forEach(t => { allTags[t] = (allTags[t] || 0) + 1; });
}));
const tagCloud = document.getElementById('tagCloud');
function renderTagCloud() {
  tagCloud.innerHTML = '';
  Object.entries(allTags).sort((a,b)=>b[1]-a[1]).forEach(([tag, count]) => {
    const chip = document.createElement('span');
    chip.className = 'tag-chip' + (state.tags.has(tag) ? ' active' : '');
    chip.innerHTML = escapeHtml(tag) + '<span class="count">' + count + '</span>';
    chip.addEventListener('click', () => {
      if (state.tags.has(tag)) state.tags.delete(tag); else state.tags.add(tag);
      renderTagCloud();
      render();
    });
    tagCloud.appendChild(chip);
  });
  renderActiveTags();
  updateTagToggleButton();
}

let state = { mode: 'teaching', year: 'all', view: 'list', showAnswer: false, showSolution: false, showMethods: false, showDiagram: false, search: '', tags: new Set(), singleNo: 1 };
const app = document.getElementById('app');
const attempts = new Map();
const hintProgress = new Map();
const teachingHints = new Set();
const questionKey = q => q.year + '-' + q.no;
const yearSel = document.getElementById('yearSel');
const viewSel = document.getElementById('viewSel');
const singleNo = document.getElementById('singleNo');
const search = document.getElementById('search');
const btnToggleAns = document.getElementById('btnToggleAns');
const btnExpandSol = document.getElementById('btnExpandSol');
const btnToggleTags = document.getElementById('btnToggleTags');
const activeTagsEl = document.getElementById('activeTags');

function renderActiveTags() {
  if (!state.tags.size) {
    activeTagsEl.innerHTML = '<span class="active-tag none">未选标签</span>';
    return;
  }
  activeTagsEl.innerHTML = [...state.tags].map(t => '<span class="active-tag">' + escapeHtml(t) + '</span>').join('');
}

function renderAnsHint() {
  const el = document.getElementById('ansHint');
  if (!el) return;
  el.textContent = state.showAnswer ? '已全局显示答案。如只想核对，可切换到“全卷答案”视图。' : '';
}

function updateTagToggleButton() {
  const arrow = tagCloud.classList.contains('hidden') ? '▼' : '▲';
  const count = state.tags.size ? ' (' + state.tags.size + ')' : '';
  btnToggleTags.textContent = '标签筛选' + count + ' ' + arrow;
}

function getQuestions() {
  const ys = state.year === 'all' ? years : [state.year];
  let qs = [];
  ys.forEach(y => qs = qs.concat(KANGAROO_DATA[y].map(q => ({...q, year: y}))));
  if (state.tags.size) {
    qs = qs.filter(q => (q.tags || []).some(t => state.tags.has(t)));
  }
  if (state.search.trim()) {
    const term = state.search.toLowerCase();
    qs = qs.filter(q => q.text.toLowerCase().includes(term) || String(q.no).includes(term) || (q.tags || []).some(t => t.toLowerCase().includes(term)));
  }
  return qs;
}

function renderAnswers() {
  const ys = state.year === 'all' ? years : [state.year];
  let html = '<div class="view-ans"><h2>全卷答案</h2><p>选中试卷：' + (state.year==='all' ? '1999 + 2002' : state.year) + '</p>';
  ys.forEach(y => {
    html += '<h3>' + y + ' 年 · Grade ' + (y === '1999' ? '3–4' : '5–6') + '</h3><div class="ans-grid">';
    KANGAROO_DATA[y].forEach(q => {
      html += '<div class="ans-cell"><span class="q">Q' + q.no + '</span><span class="a">' + q.answer + '</span></div>';
    });
    html += '</div>';
  });
  html += '</div>';
  app.innerHTML = html;
}

function svgFor(year, no) { return DIAGRAMS[year + '-' + no] || null; }

function optionCard(q, letter, text) {
  const selected = state.mode === 'practice' && attempts.get(questionKey(q)) === letter;
  const correct = q.answer === letter;
  const reveal = state.mode === 'teaching' && state.showAnswer && correct;
  const cls = 'option' + (reveal || (selected && correct) ? ' correct' : selected ? ' incorrect' : '');
  return '<button type="button" class="' + cls + '" data-letter="' + letter + '" onclick="chooseAnswer(this)"><span class="letter">' + letter + '</span><span class="opt-text">' + escapeHtml(text) + '</span>' + (selected || reveal ? '<span class="check">' + (correct ? ' ✅' : ' ❌') + '</span>' : '') + '</button>';
}

function setCardAnswer(card, q, show) {
  const opt = card.querySelector('.option[data-letter="' + q.answer + '"]');
  if (!opt) return;
  const checkSpan = opt.querySelector('.check');
  if (show) {
    opt.classList.add('correct');
    if (!checkSpan) opt.insertAdjacentHTML('beforeend', '<span class="check"> ✅</span>');
  } else {
    opt.classList.remove('correct');
    if (checkSpan) checkSpan.remove();
  }
}

function tagClickHandler(e) {
  const tag = e.target.dataset.tag;
  if (!tag) return;
  if (state.tags.has(tag)) state.tags.delete(tag); else state.tags.add(tag);
  renderTagCloud();
  render();
}

function questionCard(q) {
  let html = '<div class="q-card" data-year="' + q.year + '" data-no="' + q.no + '">';
  html += '<div class="q-header"><span class="q-title">' + q.year + ' · Grade ' + q.grade + ' · Q' + q.no + '</span><span class="q-badge q-points">' + q.points + ' 分</span>';
  (q.tags || []).forEach(t => {
    html += '<span class="q-badge q-tag" data-tag="' + escapeHtml(t) + '">' + escapeHtml(t) + '</span>';
  });
  html += '</div>';
  html += '<div class="q-text">' + escapeHtml(q.text).replace(/\n/g, '<br>') + '</div>';
  html += '<div class="options">';
  ['A','B','C','D','E'].forEach(letter => {
    if (q.options[letter]) html += optionCard(q, letter, q.options[letter]);
  });
  html += '</div>';
  const attempt = attempts.get(questionKey(q));
  if (state.mode === 'practice') html += '<div class="feedback ' + (attempt ? (attempt === q.answer ? 'correct' : 'incorrect') : '') + '" role="status">' + (attempt ? (attempt === q.answer ? '✅ 正确！' : '❌ 错误，再试一次。') : '请选择一个答案') + '</div>';
  html += '<div class="q-actions"><button onclick="showHint(this)">' + (state.mode === 'teaching' && teachingHints.has(questionKey(q)) ? '隐藏 Hint' : '显示 Hint') + '</button>';
  if (state.mode === 'teaching') {
  html += '<button onclick="toggleOne(this, \'answer\')">' + (state.showAnswer ? '隐藏答案' : '显示答案') + '</button>';
  html += '<button onclick="toggleOne(this, \'solution\')">' + (state.showSolution ? '隐藏详解' : '显示详解') + '</button>';
  html += '<button onclick="toggleOne(this, \'methods\')">' + (state.showMethods ? '隐藏思路' : '显示多种思路') + '</button>';
  if (svgFor(q.year, q.no) || q.diagram) html += '<button onclick="toggleOne(this, \'diagram\')">' + (state.showDiagram ? '隐藏图解' : '显示图解') + '</button>';
  }
  html += '</div>';
  const hintIndex = hintProgress.get(questionKey(q));
  if (state.mode === 'teaching' && teachingHints.has(questionKey(q))) html += teachingHintSection(q);
  else if (state.mode === 'practice' && hintIndex !== undefined) html += hintSection(q, hintIndex % hintsFor(q).length);

  if (state.mode === 'teaching' && state.showSolution) {
    html += '<div class="section solution"><h4>详细解答</h4><p>' + escapeHtml(q.solution).replace(/\n/g, '<br>') + '</p></div>';
  }
  if (state.mode === 'teaching' && state.showMethods && q.methods && q.methods.length) {
    html += '<div class="section methods"><h4>其他思路</h4><ul>' + q.methods.map(m => '<li>' + escapeHtml(m).replace(/\n/g, '<br>') + '</li>').join('') + '</ul></div>';
  }
  if (state.mode === 'teaching' && state.showDiagram) {
    const svg = svgFor(q.year, q.no);
    if (svg) {
      html += '<div class="section diagram"><h4>参考图解</h4>' + svg + '</div>';
    } else if (q.diagram) {
      html += '<div class="section diagram"><h4>参考图解</h4><p style="text-align:left">' + escapeHtml(q.diagram) + '</p></div>';
    }
  }
  if (state.mode === 'teaching' && q.tip) {
    html += '<div class="section tip"><h4>备课提示</h4><p>' + escapeHtml(q.tip).replace(/\n/g, '<br>') + '</p></div>';
  }
  html += '</div>';
  return html;
}

function renderList() {
  const qs = getQuestions();
  if (!qs.length) { app.innerHTML = '<div class="empty">没有匹配的题目</div>'; return; }
  app.innerHTML = '<div class="q-list">' + qs.map(questionCard).join('') + '</div>';
  document.querySelectorAll('.q-tag').forEach(el => el.addEventListener('click', tagClickHandler));
}

function renderSingle() {
  const ys = state.year === 'all' ? years : [state.year];
  let found = null;
  for (const y of ys) {
    const q = KANGAROO_DATA[y].find(x => x.no === Number(state.singleNo));
    if (q) { found = {...q, year: y}; break; }
  }
  if (!found) { app.innerHTML = '<div class="empty">未找到该题号，请切换年份或输入有效题号</div>'; return; }
  app.innerHTML = '<div class="q-list">' + questionCard(found) + '</div>';
  document.querySelectorAll('.q-tag').forEach(el => el.addEventListener('click', tagClickHandler));
}

function render() {
  if (state.view === 'answers') { renderAnswers(); return; }
  if (state.view === 'single') { renderSingle(); return; }
  renderList();
}

function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

window.toggleOne = function(btn, kind) {
  if (state.mode !== 'teaching') return;
  const card = btn.closest('.q-card');
  const year = card.dataset.year;
  const no = Number(card.dataset.no);
  const q = KANGAROO_DATA[year].find(x => x.no === no);
  const mapped = {...q, year};
  if (kind === 'answer') {
    const showing = btn.textContent.includes('隐藏');
    setCardAnswer(card, mapped, !showing);
    btn.textContent = showing ? '显示答案' : '隐藏答案';
    return;
  }
  let section = null;
  const sections = card.querySelectorAll('.section');
  sections.forEach(sec => {
    const h4 = sec.querySelector('h4');
    if (!h4) return;
    const text = h4.textContent;
    if (kind === 'solution' && text.includes('详细')) section = sec;
    if (kind === 'methods' && text.includes('思路')) section = sec;
    if (kind === 'diagram' && text.includes('图解')) section = sec;
  });
  if (section) { section.remove(); btn.textContent = btn.textContent.replace('隐藏','显示'); return; }
  let insertHtml = '';
  if (kind === 'solution') {
    insertHtml = '<div class="section solution"><h4>详细解答</h4><p>' + escapeHtml(mapped.solution).replace(/\n/g,'<br>') + '</p></div>';
  } else if (kind === 'methods') {
    insertHtml = '<div class="section methods"><h4>其他思路</h4><ul>' + mapped.methods.map(m => '<li>' + escapeHtml(m).replace(/\n/g,'<br>') + '</li>').join('') + '</ul></div>';
  } else if (kind === 'diagram') {
    const svg = svgFor(year, no);
    if (svg) insertHtml = '<div class="section diagram"><h4>参考图解</h4>' + svg + '</div>';
    else if (mapped.diagram) insertHtml = '<div class="section diagram"><h4>参考图解</h4><p style="text-align:left">' + escapeHtml(mapped.diagram) + '</p></div>';
  }
  if (insertHtml) { card.insertAdjacentHTML('beforeend', insertHtml); btn.textContent = btn.textContent.replace('显示','隐藏'); }
};

yearSel.addEventListener('change', e => { state.year = e.target.value; state.singleNo = 1; singleNo.value = 1; if (state.year !== 'all') singleNo.max = KANGAROO_DATA[state.year].length; else singleNo.max = 30; render(); });
viewSel.addEventListener('change', e => {
  state.view = e.target.value;
  singleNo.style.display = state.view === 'single' ? 'inline-block' : 'none';
  render();
});
singleNo.addEventListener('input', e => { state.singleNo = Number(e.target.value); if (state.view === 'single') render(); });
search.addEventListener('input', e => { state.search = e.target.value; render(); });

btnToggleAns.addEventListener('click', () => {
  state.showAnswer = !state.showAnswer;
  btnToggleAns.textContent = state.showAnswer ? '隐藏所有答案' : '显示所有答案';
  btnToggleAns.className = state.showAnswer ? 'danger' : 'ok';
  renderAnsHint();
  render();
});
btnExpandSol.addEventListener('click', () => { state.showSolution = !state.showSolution; btnExpandSol.textContent = state.showSolution ? '收起全部详解' : '展开全部详解'; render(); });

btnToggleTags.addEventListener('click', () => {
  tagCloud.classList.toggle('hidden');
  updateTagToggleButton();
});

function cardQuestion(btn) {
  const card = btn.closest('.q-card');
  return {...KANGAROO_DATA[card.dataset.year].find(q => q.no === Number(card.dataset.no)), year: card.dataset.year};
}
const HINT_STORAGE = 'kangaroo-hints-v1';
let customHints = {};
try {
  const saved = JSON.parse(localStorage.getItem(HINT_STORAGE) || '{}');
  if (saved && typeof saved === 'object' && !Array.isArray(saved)) {
    for (const [key, value] of Object.entries(saved)) {
      if (Array.isArray(value) && value.length && value.every(h => typeof h === 'string' && h.trim())) customHints[key] = value;
    }
  }
} catch (_) { /* Default hints remain available when storage is unavailable. */ }
function hintsFor(q) { return customHints[questionKey(q)] || q.hints; }
const hintEditor = document.getElementById('hintEditor');
const hintFields = document.getElementById('hintFields');
let editingQuestion = null;
function addHintField(value = '') {
  const row = document.createElement('div'); row.className = 'hint-field';
  const label = document.createElement('label'); label.textContent = 'Hint（由浅到深）';
  const input = document.createElement('textarea'); input.value = value; input.required = true;
  label.appendChild(input); row.appendChild(label);
  const remove = document.createElement('button'); remove.type = 'button'; remove.className = 'secondary'; remove.textContent = '删除此条';
  remove.onclick = () => row.remove(); row.appendChild(remove); hintFields.appendChild(row);
}
window.editHints = function(btn) {
  if (state.mode !== 'teaching') return;
  editingQuestion = cardQuestion(btn); hintFields.replaceChildren();
  document.getElementById('hintEditorTitle').textContent = editingQuestion.year + ' · Q' + editingQuestion.no + ' 编辑 Hint';
  document.getElementById('hintError').textContent = '';
  hintsFor(editingQuestion).forEach(addHintField); hintEditor.showModal();
};
document.getElementById('addHint').onclick = () => addHintField();
document.getElementById('cancelHints').onclick = () => hintEditor.close();
document.getElementById('hintForm').onsubmit = e => {
  e.preventDefault();
  const values = [...hintFields.querySelectorAll('textarea')].map(el => el.value.trim());
  if (!values.length || values.some(h => !h)) {
    document.getElementById('hintError').textContent = '请至少保留一条 Hint，且内容不能为空。'; return;
  }
  const updated = {...customHints, [questionKey(editingQuestion)]: values};
  try { localStorage.setItem(HINT_STORAGE, JSON.stringify(updated)); }
  catch (_) { document.getElementById('hintError').textContent = '浏览器无法保存，请允许网站存储后重试。编辑内容已保留。'; return; }
  customHints = updated; hintProgress.delete(questionKey(editingQuestion));
  hintEditor.close(); const top = app.scrollTop; render(); app.scrollTop = top;
};
function teachingHintSection(q) {
  return '<div class="section hint"><h4>全部 Hint</h4><ol>' + hintsFor(q).map(h => '<li>' + escapeHtml(h) + '</li>').join('') + '</ol><button class="secondary" onclick="editHints(this)">编辑 Hint</button></div>';
}
function hintSection(q, i) {
  return '<div class="section hint" role="status"><h4>Hint ' + (i + 1) + ' / ' + hintsFor(q).length + '</h4><p>' + escapeHtml(hintsFor(q)[i]).replace(/\n/g, '<br>') + '</p><small>由浅到深；全部看完后再次点击将回到第一条。</small></div>';
}
window.showHint = function(btn) {
  const q = cardQuestion(btn);
  if (state.mode === 'teaching') {
    const card = btn.closest('.q-card');
    if (teachingHints.has(questionKey(q))) {
      teachingHints.delete(questionKey(q)); card.querySelector('.hint')?.remove(); btn.textContent = '显示 Hint';
    } else {
      teachingHints.add(questionKey(q));
      card.querySelector('.q-actions').insertAdjacentHTML('afterend', teachingHintSection(q));
      btn.textContent = '隐藏 Hint';
    }
    return;
  }
  const i = ((hintProgress.get(questionKey(q)) ?? -1) + 1) % hintsFor(q).length;
  if (!window.confirm('确认查看 Hint ' + (i + 1) + ' / ' + hintsFor(q).length + ' 吗？')) return;
  hintProgress.set(questionKey(q), i);
  const card = btn.closest('.q-card');
  const old = card.querySelector('.hint');
  if (old) old.remove();
  card.querySelector('.q-actions').insertAdjacentHTML('afterend', hintSection(q, i));
  card.querySelector('.hint').scrollIntoView({block: 'nearest'});
};
window.chooseAnswer = function(btn) {
  if (state.mode !== 'practice') return;
  const q = cardQuestion(btn);
  attempts.set(questionKey(q), btn.dataset.letter);
  const top = app.scrollTop;
  render();
  app.scrollTop = top;
  app.querySelector('.q-card[data-year="' + q.year + '"][data-no="' + q.no + '"] [data-letter="' + btn.dataset.letter + '"]').focus({preventScroll: true});
};
document.getElementById('modeToggle').addEventListener('click', e => {
  state.mode = state.mode === 'teaching' ? 'practice' : 'teaching';
  const practice = state.mode === 'practice';
  state.showAnswer = state.showSolution = state.showMethods = state.showDiagram = false;
  btnToggleAns.hidden = btnExpandSol.hidden = practice;
  btnToggleAns.textContent = '显示所有答案'; btnToggleAns.className = 'ok';
  btnExpandSol.textContent = '展开全部详解';
  viewSel.querySelector('[value="answers"]').disabled = practice;
  viewSel.querySelector('[value="answers"]').hidden = practice;
  if (practice && state.view === 'answers') { state.view = 'list'; viewSel.value = 'list'; }
  e.currentTarget.textContent = practice ? '练习版 · 切换教学版' : '教学版 · 切换练习版';
  e.currentTarget.setAttribute('aria-pressed', String(practice));
  renderAnsHint(); render();
});

renderTagCloud();
renderAnsHint();
render();
</script>
</body>
</html>
