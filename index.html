<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<script src="paper-2004-g5-6.js"></script>
<script src="paper-2005-g5-6.js"></script>

<style>
:root {
  --bg: #f8fafc;
  --surface: #ffffff;
  --text: #1f2937;
  --muted: #6b7280;
  --accent: #2563eb;
  --accent-light: #dbeafe;
  --danger: #dc2626;
  --danger-light: #fee2e2;
  --ok: #16a34a;
  --ok-light: #dcfce7;
  --warn: #d97706;
  --warn-light: #fef3c7;
  --border: #e5e7eb;
  --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
}
* { box-sizing: border-box; }
body {
  margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.6;
}
header {
  background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px; line-height: 1.2;
  padding: 4px 12px; position: relative; z-index: 20; flex-shrink: 0;
  box-shadow: var(--shadow);
}
header h1 { margin: 0; font-size: 15px; white-space: nowrap; flex-shrink: 0; line-height: 1.2; }
#brand {
  display: flex; align-items: center; gap: 6px; border: 0; background: none; padding: 0; margin: 0;
  font: inherit; font-size: 15px; font-weight: 700; color: var(--text); cursor: pointer; line-height: 1.2;
}
#brand:hover { color: var(--accent); }
.controls {
  display: flex; gap: 6px; align-items: center; flex: 1; min-width: 0;
  overflow-x: auto; overflow-y: hidden; padding: 0; scrollbar-width: thin;
}
.controls > * { flex-shrink: 0; }
.controls select, .controls input, .controls button,
.overflow-menu select, .overflow-menu input, .overflow-menu button { font-size: 12px; line-height: 1.2; padding: 3px 7px; white-space: nowrap; }
.controls::-webkit-scrollbar { height: 6px; }
.controls::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
/* Toolbar groups: paper selection | search & tags | reveal toggles. */
.controls > .group-start { margin-left: 9px; padding-left: 9px; border-left: 1px solid var(--border); }
.controls > #overflowBtn { margin-left: auto; letter-spacing: 1px; }
#search { width: 160px; }
#modeToggle { margin-left: 6px; }
.overflow-menu {
  position: absolute; top: 100%; right: 12px; z-index: 30; min-width: 190px; max-height: 60dvh; overflow-y: auto;
  display: flex; flex-direction: column; gap: 8px; align-items: stretch;
  padding: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 0 0 12px 12px; box-shadow: var(--shadow);
}
.overflow-menu.hidden { display: none; }
.overflow-menu > * { width: 100%; text-align: left; justify-content: flex-start; }
.overflow-menu #search { width: 100%; }
.overflow-menu .tag-filter { flex-direction: column; align-items: stretch; gap: 6px; }
.overflow-menu .tag-filter #btnToggleTags { justify-content: flex-start; }
.overflow-menu .active-tags { max-width: none; flex-wrap: wrap; }
.tag-filter { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
.tag-filter:has(.active-tag) { border-color: #bfdbfe; background: #eff6ff; }
.tag-filter #btnToggleTags { border: 0; background: transparent; }
.tag-filter #btnToggleTags span:empty { display: none; }
.tag-filter #btnToggleTags { gap: 4px; }
select, input[type="text"], input[type="number"], button {
  font: inherit; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text);
}
button { cursor: pointer; transition: .15s; background: var(--accent-light); border-color: var(--accent); color: var(--accent); font-weight: 600; }
button:hover { background: var(--accent); color: #fff; }
button.secondary { background: var(--bg); border-color: var(--border); color: var(--text); }
button.secondary:hover { background: #eef2ff; color: var(--accent); }
button.danger { background: var(--danger-light); border-color: var(--danger); color: var(--danger); }
button.danger:hover { background: var(--danger); color: #fff; }
button.ok { background: var(--ok-light); border-color: var(--ok); color: var(--ok); }
button.ok:hover { background: var(--ok); color: #fff; }
main { padding: 24px; max-width: 1200px; margin: 0 auto; }
.tag-cloud { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; position: absolute; top: 100%; left: 12px; right: 12px; max-height: 40dvh; overflow-y: auto; padding: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 0 0 12px 12px; box-shadow: var(--shadow); }
.tag-cloud.hidden { display: none; }
.tag-chip { padding: 5px 12px; border-radius: 16px; background: #f3f4f6; color: #374151; border: 1px solid var(--border); font-size: 13px; cursor: pointer; transition: .15s; user-select: none; }
.tag-chip:hover { background: #e5e7eb; }
.tag-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.tag-chip .count { margin-left: 4px; opacity: .75; font-size: 11px; }
.active-tags { display: inline-flex; gap: 4px; align-items: center; max-width: 240px; overflow-x: auto; scrollbar-width: none; }
.active-tags::-webkit-scrollbar { display: none; }
.active-tags:not(:empty) { padding-left: 6px; }
.active-tag { padding: 2px 8px; line-height: 1.2; border-radius: 14px; background: var(--accent-light); color: var(--accent); font-size: 12px; font-weight: 600; }
button.active-tag { display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0; border: 0; }
button.active-tag:hover { background: #dbeafe; color: var(--accent); }
.view-ans { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 24px; box-shadow: var(--shadow); }
.ans-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 10px; margin-top: 12px; }
.ans-cell { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-radius: 8px; background: #f3f4f6; font-size: 14px; }
.ans-cell .q { color: var(--muted); }
.ans-cell .a { font-weight: bold; color: var(--accent); font-size: 16px; }
.q-list { display: grid; gap: 20px; }
.q-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; box-shadow: var(--shadow); }
.q-header { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.q-badge { padding: 3px 10px; border-radius: 20px; font-size: 13px; font-weight: 600; }
.q-points { background: var(--warn-light); color: var(--warn); }
.q-tag { background: #f3e8ff; color: #7e22ce; cursor: pointer; }
.q-tag:hover { background: #e9d5ff; }
.q-title { font-size: 18px; font-weight: 700; }
.q-text { font-size: 16px; margin: 10px 0; }
.options { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin: 14px 0; }
.option { border: 2px solid var(--border); border-radius: 10px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; cursor: pointer; transition: .15s; }
.option:hover { border-color: var(--accent); background: #f8fafc; }
.option .letter { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #f3f4f6; font-weight: 700; }
.option.correct { border-color: var(--ok); background: var(--ok-light); }
.option.correct .letter { background: var(--ok); color: #fff; }
.q-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.section { margin-top: 14px; padding: 14px; border-radius: 10px; background: #f8fafc; border: 1px solid var(--border); }
.section h4 { margin: 0 0 8px; font-size: 15px; color: var(--accent); }
.section.solution { background: #eff6ff; border-color: #bfdbfe; }
.section.methods { background: #f5f3ff; border-color: #ddd6fe; }
.section.diagram { background: #fffbeb; border-color: #fde68a; text-align: center; }
.section.tip { background: #f0fdf4; border-color: #bbf7d0; }
.section.tip h4 { color: var(--ok); }
.mk-diagram { max-width: 100%; height: auto; max-height: 260px; }
.empty { text-align: center; color: var(--muted); padding: 60px 20px; }
footer { text-align: center; color: var(--muted); padding: 30px; font-size: 13px; }
@media (max-width: 640px) {
  .options { grid-template-columns: 1fr; }
}

html, body { height: 100%; }
body { height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
#modeToggle { border: 0; border-radius: 999px; padding: 4px 10px; background: #eef2ff; color: var(--accent); font-size: 12px; line-height: 1.2; }
#modeToggle:hover { background: #dbeafe; }
main { width: 100%; flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 10px 24px 12px; }
.q-list { display: grid; gap: 20px; }
.q-card { min-height: 0; }
footer { padding: 0 4px 2px; font-size: 10px; line-height: 1.2; }
button:disabled { opacity: .4; cursor: default; }
.option { background: white; color: var(--text); font-weight: 400; text-align: left; }
.option:hover { color: var(--text); }
.option.incorrect { border-color: var(--danger); background: var(--danger-light); }
.option.incorrect .letter { background: var(--danger); color: white; }
.feedback { min-height: 1.6em; font-weight: 600; }
.feedback.correct { color: var(--ok); }
.feedback.incorrect { color: var(--danger); }
.section.hint { background: #fffbeb; border-color: #fde68a; }
button:focus-visible, main:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
header :focus-visible { outline-offset: -2px; }
@media (max-width: 640px) {
  header { padding: 3px 6px; gap: 6px; } header h1 { font-size: 13px; }
  .brand-text { display: none; }
  #modeToggle { font-size: 12px; padding: 3px 8px; }
  .controls { gap: 5px; }
  .controls > .group-start { margin-left: 6px; padding-left: 6px; }
  .overflow-menu { left: 12px; }
  main { padding: 8px 10px 10px; } .q-card { padding: 14px; }
  footer { display: none; }
}
dialog { width: min(640px, 94vw); max-height: 85dvh; overflow: auto; border: 1px solid var(--border); border-radius: 14px; padding: 24px; }
dialog::backdrop { background: #0f172a80; }
.hint-field { margin: 16px 0; }
.hint-field textarea { display: block; width: 100%; min-height: 90px; resize: vertical; font: inherit; padding: 10px; border: 1px solid var(--border); border-radius: 8px; }
.hint li { white-space: pre-wrap; margin: 8px 0; }
#hintError { color: var(--danger); }
.section.extension { background: #f0fdfa; border-color: #99f6e4; }
.extension .extension-text { white-space: pre-wrap; line-height: 1.8; }
.extension .extension-context { color: var(--muted); font-size: 14px; }
.extension details { margin-top: 14px; border-top: 1px solid #99f6e4; padding-top: 12px; }
.extension summary { cursor: pointer; color: #0f766e; font-weight: 600; }
.extension summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.question-figure { margin: 14px 0; }
.question-figure img { display: block; max-width: 100%; height: auto; border-radius: 6px; }
.question-figure figcaption { color: var(--muted); font-size: 12px; margin-top: 6px; }
.source-issue { background: #fffbeb; border: 1px solid #fde68a; padding: 12px; border-radius: 8px; }
.ans-cell .a { overflow-wrap: anywhere; }
button[hidden] { display: none !important; }

button.disclosure { display: inline-flex; align-items: center; gap: 7px; background: var(--surface); border-color: var(--border); color: var(--muted); font-weight: 500; }
button.disclosure:hover { background: var(--bg); color: var(--accent); border-color: #93c5fd; }
button.disclosure[aria-expanded="true"] { background: #eff6ff; border-color: #bfdbfe; color: var(--accent); }
.disclosure svg { width: 16px; height: 16px; flex-shrink: 0; transition: transform 180ms ease; }
.disclosure[aria-expanded="true"] svg { transform: rotate(90deg); }
.section { animation: panel-in 180ms ease-out; }
@keyframes panel-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
@media (prefers-reduced-motion: reduce) { .section { animation: none; } .disclosure svg { transition: none; } }
</style>
</head>
<body>
<header>
  <h1><button type="button" id="brand" title="清除全部筛选，回到所有题目"><span aria-hidden="true">🦘</span><span class="brand-text">Math Kangaroo 备课站</span></button></h1>
  <div class="controls" id="toolbar" role="group" aria-label="题目筛选与功能">
    <select id="gradeSel" data-group="paper" data-priority="0" aria-label="年级">
      <option value="all">全部年级</option>
    </select>
    <select id="yearSel" data-group="paper" data-priority="1" aria-label="年份" disabled>
      <option value="all">全部年份</option>
    </select>
    <select id="viewSel" data-group="paper" data-priority="2">
      <option value="list">全部题目</option>
      <option value="single">单题查看</option>
      <option value="answers">全卷答案</option>
    </select>
    <input type="number" id="singleNo" data-group="paper" data-priority="3" min="1" max="30" placeholder="题号" style="width:80px;display:none">
    <input type="text" id="search" data-group="filter" data-priority="4" placeholder="搜索题目内容/关键词/标签">
    <div class="tag-filter" data-group="filter" data-priority="5" role="group" aria-label="标签筛选">
      <span id="activeTags" class="active-tags"></span>
      <button id="btnToggleTags" class="secondary" aria-controls="tagCloud" aria-label="标签筛选">标签筛选</button>
    </div>
    <button id="btnToggleAns" data-group="reveal" data-priority="6" class="ok">显示所有答案</button>
    <button id="btnExpandSol" data-group="reveal" data-priority="7" class="secondary">展开全部详解</button>
    <button type="button" id="overflowBtn" class="secondary" hidden aria-expanded="false" aria-controls="overflowMenu" aria-label="更多工具" title="更多工具">⋯</button>
  </div>
  <div class="tag-cloud hidden" id="tagCloud" aria-label="可选标签"></div>
  <nav class="overflow-menu hidden" id="overflowMenu" aria-label="更多工具"></nav>
  <button type="button" id="modeToggle" aria-pressed="false">教学版</button>
</header>

<main id="app" tabindex="0" aria-label="题目浏览区"></main>
<dialog id="hintEditor" aria-labelledby="hintEditorTitle">
<form id="hintForm"><h2 id="hintEditorTitle">编辑 Hint</h2><p>按由浅到深排列。保存到当前浏览器，刷新后保留；不会同步到其他设备。</p>
<div id="hintFields"></div><button type="button" id="addHint">＋ 添加一条</button>
<p id="hintError" role="alert"></p><div class="q-actions"><button type="submit">保存 Hint</button><button type="button" id="cancelHints" class="secondary">取消</button></div></form>
</dialog>

<footer>
  Generated for lesson prep · Math Kangaroo · Grade 3–4 / Grade 5–6
</footer>

<script>
const years = Object.keys(KANGAROO_DATA).sort();
// Paper IDs retain legacy keys so existing saved hints still resolve.
const paperYear = id => id.split('-')[0];
const paperLabel = id => paperYear(id) + ' 年 · Grade ' + KANGAROO_DATA[id][0].grade;
const allTags = {};
years.forEach(y => KANGAROO_DATA[y].forEach(q => {
  (q.tags || []).forEach(t => { allTags[t] = (allTags[t] || 0) + 1; });
}));
const tagCloud = document.getElementById('tagCloud');
function renderTagCloud() {
  tagCloud.innerHTML = '';
  Object.entries(allTags).sort((a,b)=>b[1]-a[1]).forEach(([tag, count]) => {
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'tag-chip' + (state.tags.has(tag) ? ' active' : '');
    chip.setAttribute('aria-pressed', String(state.tags.has(tag)));
    chip.innerHTML = escapeHtml(tag) + '<span class="count">' + count + '</span>';
    chip.addEventListener('click', () => toggleTag(tag));
    tagCloud.appendChild(chip);
  });
  renderActiveTags();
  updateTagToggleButton();
}

let state = { mode: 'teaching', grade: 'all', year: 'all', view: 'list', showAnswer: false, showSolution: false, showMethods: false, showDiagram: false, search: '', tags: new Set(), singleNo: 1 };
let tagReturnContext = null;
const app = document.getElementById('app');
const attempts = new Map();
const hintProgress = new Map();
const teachingHints = new Set();
const openExtensions = new Set();
const questionKey = q => q.year + '-' + q.no;
const yearSel = document.getElementById('yearSel');
const gradeSel = document.getElementById('gradeSel');
const paperGrade = id => KANGAROO_DATA[id][0].grade;
const grades = [...new Set(years.map(paperGrade))].sort((a, b) => a.localeCompare(b, undefined, {numeric: true}));
grades.forEach(grade => gradeSel.add(new Option('Grade ' + grade.replace('-', '–'), grade)));
function selectedPapers() {
  return state.year === 'all' ? years.filter(id => state.grade === 'all' || paperGrade(id) === state.grade) : [state.year];
}
function syncPaperSelectors() {
  gradeSel.value = state.grade;
  yearSel.replaceChildren(new Option('全部年份', 'all'));
  if (state.grade !== 'all') {
    years.filter(id => paperGrade(id) === state.grade).forEach(id => yearSel.add(new Option(paperYear(id) + ' 年', id)));
  }
  yearSel.disabled = state.grade === 'all';
  yearSel.value = state.year;
  singleNo.max = Math.max(...selectedPapers().map(id => KANGAROO_DATA[id].length));
}
const viewSel = document.getElementById('viewSel');
const singleNo = document.getElementById('singleNo');
const search = document.getElementById('search');
const btnToggleAns = document.getElementById('btnToggleAns');
const btnExpandSol = document.getElementById('btnExpandSol');
const btnToggleTags = document.getElementById('btnToggleTags');
const activeTagsEl = document.getElementById('activeTags');
const brand = document.getElementById('brand');
const toolbar = document.getElementById('toolbar');
const overflowBtn = document.getElementById('overflowBtn');
const overflowMenu = document.getElementById('overflowMenu');
const tagFilter = document.querySelector('.tag-filter');
const toolbarItems = [...toolbar.children].filter(el => el !== overflowBtn);

function toggleTag(tag, sourceCard = null) {
  let returnContext = null;
  if (state.tags.has(tag)) {
    state.tags.delete(tag);
    if (!state.tags.size && tagReturnContext) {
      returnContext = tagReturnContext;
      Object.assign(state, returnContext.filters);
      tagReturnContext = null;
    }
  } else {
    // Keep the original destination until the entire tag exploration ends.
    if (!state.tags.size) {
      tagReturnContext = {
        filters: {grade: state.grade, year: state.year, view: state.view, singleNo: state.singleNo, search: state.search},
        question: sourceCard ? {year: sourceCard.dataset.year, no: sourceCard.dataset.no} : null,
        scrollTop: app.scrollTop
      };
    }
    state.tags.add(tag);
    state.grade = 'all';
    state.year = 'all';
    state.view = 'list';
    state.search = '';
  }
  syncPaperSelectors();
  viewSel.value = state.view;
  singleNo.value = state.singleNo;
  singleNo.style.display = state.view === 'single' ? 'inline-block' : 'none';
  search.value = state.search;
  renderTagCloud();
  render();
  if (returnContext) {
    const q = returnContext.question;
    const card = q && app.querySelector('.q-card[data-year="' + q.year + '"][data-no="' + q.no + '"]');
    if (card) {
      app.scrollTop += card.getBoundingClientRect().top - app.getBoundingClientRect().top - 16;
    } else {
      app.scrollTop = returnContext.scrollTop;
    }
  } else {
    app.scrollTop = 0;
  }
}

function renderActiveTags() {
  if (!state.tags.size) {
    activeTagsEl.innerHTML = '';
    return;
  }
  activeTagsEl.innerHTML = [...state.tags].map(t => '<button type="button" class="active-tag" data-remove-tag="' + escapeHtml(t) + '" aria-label="取消“' + escapeHtml(t) + '”筛选" title="点击取消此标签筛选">' + escapeHtml(t) + '<span aria-hidden="true">×</span></button>').join('');
}
activeTagsEl.addEventListener('click', e => {
  const button = e.target.closest('button[data-remove-tag]');
  if (!button) return;
  toggleTag(button.dataset.removeTag);
  (activeTagsEl.querySelector('button') || btnToggleTags).focus({preventScroll: true});
});

function updateTagToggleButton() {
  const expanded = !tagCloud.classList.contains('hidden');
  styleDisclosure(btnToggleTags, state.tags.size ? '' : '标签筛选', expanded);
  const label = state.tags.size ? '已选标签：' + [...state.tags].join('、') : '标签筛选';
  btnToggleTags.setAttribute('aria-label', label);
  btnToggleTags.title = (expanded ? '收起' : '展开') + '标签筛选';
}

/* Toolbar layout. Controls carry a priority so the row keeps the ones that matter
   right now and hands the rest to an overflow panel, instead of scrolling away. */
const overflowOpen = () => !overflowMenu.classList.contains('hidden');
function setOverflowOpen(open) {
  overflowMenu.classList.toggle('hidden', !open);
  overflowBtn.setAttribute('aria-expanded', String(open));
  overflowBtn.title = open ? '收起更多工具' : '更多工具';
}
function markGroupDividers() {
  let prev = null;
  toolbarItems.forEach(el => {
    if (el.parentElement !== toolbar) { el.classList.remove('group-start'); return; }
    el.classList.toggle('group-start', prev !== null && el.dataset.group !== prev);
    prev = el.dataset.group;
  });
}
function layoutToolbar() {
  // Restore collapsed items back to front so the row keeps its original order. Only
  // nodes that actually left the toolbar are re-inserted: rewriting every node would
  // drop focus each time a control re-renders while someone is typing or tabbing.
  let anchor = overflowBtn;
  for (let i = toolbarItems.length - 1; i >= 0; i--) {
    const el = toolbarItems[i];
    const stayPut = el.parentElement === toolbar ||
      (overflowOpen() && overflowMenu.contains(el) && el === document.activeElement);
    if (!stayPut) toolbar.insertBefore(el, anchor);
    anchor = el;
  }
  overflowBtn.hidden = true;
  if (toolbar.scrollWidth <= toolbar.clientWidth + 1) {
    setOverflowOpen(false);
    markGroupDividers();
    return;
  }
  overflowBtn.hidden = false;
  const pinned = new Set([gradeSel]);
  if (search.value.trim()) pinned.add(search);
  if (state.tags.size) pinned.add(tagFilter);
  if (state.view === 'single') pinned.add(singleNo);
  const candidates = toolbarItems
    .filter(el => el.offsetParent && !pinned.has(el))
    .sort((a, b) => Number(b.dataset.priority) - Number(a.dataset.priority));
  for (const el of candidates) {
    overflowMenu.appendChild(el);
    if (toolbar.scrollWidth <= toolbar.clientWidth + 1) break;
  }
  if (!overflowMenu.children.length) { overflowBtn.hidden = true; setOverflowOpen(false); }
  markGroupDividers();
}
let layoutPending = false;
function scheduleLayout() {
  if (layoutPending) return;
  layoutPending = true;
  requestAnimationFrame(() => { layoutPending = false; layoutToolbar(); });
}
new ResizeObserver(scheduleLayout).observe(toolbar);
overflowBtn.addEventListener('click', e => {
  e.stopPropagation();
  tagCloud.classList.add('hidden');
  updateTagToggleButton();
  setOverflowOpen(!overflowOpen());
});
document.addEventListener('click', e => {
  if (overflowOpen() && !overflowMenu.contains(e.target) && e.target !== overflowBtn) setOverflowOpen(false);
});
// The site title doubles as a reset that clears every filter.
brand.addEventListener('click', () => {
  Object.assign(state, {grade: 'all', year: 'all', view: 'list', singleNo: 1, search: ''});
  state.tags.clear();
  tagReturnContext = null;
  viewSel.value = 'list';
  singleNo.value = 1;
  singleNo.style.display = 'none';
  search.value = '';
  setOverflowOpen(false);
  syncPaperSelectors();
  renderTagCloud();
  render();
  app.scrollTop = 0;
});

function getQuestions() {
  const ys = selectedPapers();
  let qs = [];
  ys.forEach(y => qs = qs.concat(KANGAROO_DATA[y].map(q => ({...q, year: y}))));
  if (state.tags.size) {
    qs = qs.filter(q => (q.tags || []).some(t => state.tags.has(t)));
  }
  if (state.search.trim()) {
    const term = state.search.toLowerCase();
    qs = qs.filter(q => q.text.toLowerCase().includes(term) || String(q.no).includes(term) || (q.tags || []).some(t => t.toLowerCase().includes(term)));
  }
  return qs;
}

function renderAnswers() {
  const ys = selectedPapers();
  const selectionLabel = state.year !== 'all' ? paperLabel(state.year) : state.grade === 'all' ? '全部试卷' : 'Grade ' + state.grade + ' · 全部年份';
  let html = '<div class="view-ans"><h2>全卷答案</h2><p>选中试卷：' + selectionLabel + '</p>';
  ys.forEach(y => {
    html += '<h3>' + paperLabel(y) + '</h3><div class="ans-grid">';
    KANGAROO_DATA[y].forEach(q => {
      html += '<div class="ans-cell"><span class="q">Q' + q.no + '</span><span class="a">' + escapeHtml(q.answerDisplay || q.answer) + '</span></div>';
    });
    html += '</div>';
  });
  html += '</div>';
  app.innerHTML = html;
}

function svgFor(year, no) { return DIAGRAMS[year + '-' + no] || null; }

function optionCard(q, letter, text, revealAnswer = state.mode === 'teaching' && state.showAnswer) {
  const selected = attempts.get(questionKey(q)) === letter;
  const correct = q.answer === letter;
  const reveal = revealAnswer && correct;
  const cls = 'option' + (reveal || (selected && correct) ? ' correct' : selected ? ' incorrect' : '');
  return '<button type="button" class="' + cls + '" data-letter="' + letter + '" onclick="chooseAnswer(this)"><span class="letter">' + letter + '</span><span class="opt-text">' + escapeHtml(text) + '</span>' + (selected || reveal ? '<span class="check">' + (correct ? ' ✅' : ' ❌') + '</span>' : '') + '</button>';
}

function setCardAnswer(card, q, show) {
  const opt = card.querySelector('.option[data-letter="' + q.answer + '"]');
  if (!opt) return;
  const checkSpan = opt.querySelector('.check');
  if (show || attempts.get(questionKey(q)) === q.answer) {
    opt.classList.add('correct');
    if (!checkSpan) opt.insertAdjacentHTML('beforeend', '<span class="check"> ✅</span>');
  } else {
    opt.classList.remove('correct');
    if (checkSpan) checkSpan.remove();
  }
}

function tagClickHandler(e) {
  const tag = e.target.dataset.tag;
  if (!tag) return;
  toggleTag(tag, e.target.closest('.q-card'));
}

function questionCard(q) {
  let html = '<div class="q-card" data-year="' + q.year + '" data-no="' + q.no + '">';
  html += '<div class="q-header"><span class="q-title">' + paperYear(q.year) + ' · Grade ' + q.grade + ' · Q' + q.no + '</span><span class="q-badge q-points">' + q.points + ' 分</span>';
  (q.tags || []).forEach(t => {
    html += '<span class="q-badge q-tag" data-tag="' + escapeHtml(t) + '">' + escapeHtml(t) + '</span>';
  });
  html += '</div>';
  html += '<div class="q-text">' + escapeHtml(q.text).replace(/\n/g, '<br>') + '</div>';
  if (q.figure) html += '<figure class="question-figure"><img src="' + escapeHtml(q.figure) + '" alt="' + escapeHtml(q.figureAlt) + '" loading="lazy"><figcaption>原卷题图</figcaption></figure>';
  if (q.issue) html += '<p class="source-issue">' + escapeHtml(q.issue) + '</p>';
  html += '<div class="options">';
  ['A','B','C','D','E'].forEach(letter => {
    if (q.options[letter]) html += optionCard(q, letter, q.options[letter]);
  });
  html += '</div>';
  const attempt = attempts.get(questionKey(q));
  html += '<div class="feedback ' + (attempt ? (attempt === q.answer ? 'correct' : 'incorrect') : '') + '" role="status">' + (!q.answer ? '原卷选项存在矛盾，本题不自动判分。' : attempt ? (attempt === q.answer ? '✅ 正确！' : '❌ 错误，再试一次。') : '请选择一个答案') + '</div>';
  html += '<div class="q-actions"><button onclick="showHint(this)">' + (state.mode === 'teaching' && teachingHints.has(questionKey(q)) ? '隐藏 Hint' : '显示 Hint') + '</button>';
  if (state.mode === 'teaching') {
  html += '<button onclick="toggleOne(this, \'answer\')">' + (state.showAnswer ? '隐藏答案' : '显示答案') + '</button>';
  if (q.solution) html += '<button onclick="toggleOne(this, \'solution\')">' + (state.showSolution ? '隐藏详解' : '显示详解') + '</button>';
  if (q.methods?.length) html += '<button onclick="toggleOne(this, \'methods\')">' + (state.showMethods ? '隐藏思路' : '显示多种思路') + '</button>';
  if (svgFor(q.year, q.no) || q.diagram) html += '<button onclick="toggleOne(this, \'diagram\')">' + (state.showDiagram ? '隐藏图解' : '显示图解') + '</button>';
  if (q.tip) html += '<button onclick="toggleOne(this, \'tip\')">显示备课提示</button>';
  }
  if (KANGAROO_EXTENSIONS[questionKey(q)]) html += '<button type="button" onclick="toggleExtension(this)">延申拓展</button>';
  html += '</div>';
  const hintIndex = hintProgress.get(questionKey(q));
  if (state.mode === 'teaching' && teachingHints.has(questionKey(q))) html += teachingHintSection(q);
  else if (state.mode === 'practice' && hintIndex !== undefined) html += hintSection(q, hintIndex % hintsFor(q).length);
  if (openExtensions.has(questionKey(q))) html += extensionSection(q);

  if (state.mode === 'teaching' && state.showSolution && q.solution) {
    html += '<div class="section solution"><h4>详细解答</h4><p>' + escapeHtml(q.solution).replace(/\n/g, '<br>') + '</p></div>';
  }
  if (state.mode === 'teaching' && state.showMethods && q.methods && q.methods.length) {
    html += '<div class="section methods"><h4>其他思路</h4><ul>' + q.methods.map(m => '<li>' + escapeHtml(m).replace(/\n/g, '<br>') + '</li>').join('') + '</ul></div>';
  }
  if (state.mode === 'teaching' && state.showDiagram) {
    const svg = svgFor(q.year, q.no);
    if (svg) {
      html += '<div class="section diagram"><h4>参考图解</h4>' + svg + '</div>';
    } else if (q.diagram) {
      html += '<div class="section diagram"><h4>参考图解</h4><p style="text-align:left">' + escapeHtml(q.diagram) + '</p></div>';
    }
  }
  html += '</div>';
  return html;
}

function renderList() {
  const qs = getQuestions();
  if (!qs.length) { app.innerHTML = '<div class="empty">没有匹配的题目</div>'; return; }
  app.innerHTML = '<div class="q-list">' + qs.map(questionCard).join('') + '</div>';
  document.querySelectorAll('.q-tag').forEach(el => el.addEventListener('click', tagClickHandler));
}

function renderSingle() {
  const ys = selectedPapers();
  let found = null;
  for (const y of ys) {
    const q = KANGAROO_DATA[y].find(x => x.no === Number(state.singleNo));
    if (q) { found = {...q, year: y}; break; }
  }
  if (!found) { app.innerHTML = '<div class="empty">未找到该题号，请切换年份或输入有效题号</div>'; return; }
  app.innerHTML = '<div class="q-list">' + questionCard(found) + '</div>';
  document.querySelectorAll('.q-tag').forEach(el => el.addEventListener('click', tagClickHandler));
}

function renderContent() {
  if (state.view === 'answers') { renderAnswers(); return; }
  if (state.view === 'single') { renderSingle(); return; }
  renderList();
}

const buttonLabels = {answer: '答案', solution: '详解', methods: '多种思路', diagram: '图解', tip: '备课提示'};
function styleDisclosure(btn, label, expanded) {
  btn.classList.remove('ok', 'danger'); btn.classList.add('disclosure');
  btn.setAttribute('aria-expanded', String(expanded));
  btn.title = (expanded ? '隐藏' : '显示') + label;
  btn.innerHTML = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m7 4 6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>' + label + '</span>';
}
function closePanel(panel, btn) {
  if (!panel) return;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { panel.remove(); return; }
  btn.disabled = true;
  panel.animate([{opacity: 1, transform: 'translateY(0)'}, {opacity: 0, transform: 'translateY(-6px)'}], {duration: 160, easing: 'ease-in'}).finished.finally(() => { panel.remove(); btn.disabled = false; });
}
// Hide the global reveal toggles when the current view already shows them.
function syncGlobalToggles() {
  const redundant = state.mode === 'practice' || state.view === 'answers';
  btnToggleAns.hidden = btnExpandSol.hidden = redundant;
}
function render() {
  syncGlobalToggles();
  renderContent();
  app.querySelectorAll('.q-actions > button').forEach(btn => {
    const action = btn.getAttribute('onclick') || '';
    if (action.includes('toggleExtension')) {
      const key = questionKey(cardQuestion(btn));
      styleDisclosure(btn, '延申拓展', openExtensions.has(key));
      btn.setAttribute('aria-controls', 'extension-' + key);
      return;
    }
    if (action.includes('showHint')) {
      const key = questionKey(cardQuestion(btn));
      styleDisclosure(btn, 'Hint', state.mode === 'teaching' ? teachingHints.has(key) : hintProgress.has(key));
      return;
    }
    const kind = Object.keys(buttonLabels).find(k => action.includes("'" + k + "'"));
    if (kind) styleDisclosure(btn, buttonLabels[kind], btn.textContent.includes('隐藏'));
  });
  styleDisclosure(btnToggleAns, '全部答案', state.showAnswer);
  styleDisclosure(btnExpandSol, '全部详解', state.showSolution);
  updateTagToggleButton();
  // Let the toolbar lay out after fonts settle, then on every width change.
  scheduleLayout();
  if (document.fonts?.ready) document.fonts.ready.then(scheduleLayout);
}
function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function extensionSection(q) {
  const extension = KANGAROO_EXTENSIONS[questionKey(q)];
  return '<div class="section extension" id="extension-' + questionKey(q) + '"><h4>延申拓展</h4>' +
    '<p class="extension-text" lang="en">' + escapeHtml(extension.text) + '</p>' +
    '<p class="extension-context"><strong>小改动：</strong>' + escapeHtml(extension.change) + '</p>' +
    '<details class="extension-method"><summary>同类方法提示</summary><p>' + escapeHtml(extension.method) + '</p></details>' +
    '<details class="extension-answer"><summary>拓展答案与解析</summary><p><strong>' + escapeHtml(extension.answer) + '</strong></p><p>' + escapeHtml(extension.solution) + '</p></details></div>';
}
app.addEventListener('click', e => {
  const summary = e.target.closest('.extension details > summary');
  if (!summary || state.mode !== 'practice' || summary.parentElement.open) return;
  if (!window.confirm('确认要查看' + summary.textContent + '吗？')) e.preventDefault();
});
window.toggleExtension = function(btn) {
  const q = cardQuestion(btn);
  const key = questionKey(q);
  const card = btn.closest('.q-card');
  if (openExtensions.has(key)) {
    openExtensions.delete(key);
    closePanel(card.querySelector('.extension'), btn);
    styleDisclosure(btn, '延申拓展', false);
  } else {
    openExtensions.add(key);
    card.querySelector('.q-actions').insertAdjacentHTML('afterend', extensionSection(q));
    styleDisclosure(btn, '延申拓展', true);
  }
};

window.toggleOne = function(btn, kind) {
  if (state.mode !== 'teaching') return;
  const card = btn.closest('.q-card');
  const year = card.dataset.year;
  const no = Number(card.dataset.no);
  const q = KANGAROO_DATA[year].find(x => x.no === no);
  const mapped = {...q, year};
  if (kind === 'answer') {
    const showing = btn.getAttribute('aria-expanded') === 'true';
    setCardAnswer(card, mapped, !showing);
    styleDisclosure(btn, '答案', !showing);
    return;
  }
  let section = null;
  const sections = card.querySelectorAll('.section');
  sections.forEach(sec => {
    const h4 = sec.querySelector('h4');
    if (!h4) return;
    const text = h4.textContent;
    if (kind === 'solution' && text.includes('详细')) section = sec;
    if (kind === 'methods' && text.includes('思路')) section = sec;
    if (kind === 'diagram' && text.includes('图解')) section = sec;
    if (kind === 'tip' && text.includes('备课提示')) section = sec;
  });
  if (section) { closePanel(section, btn); styleDisclosure(btn, buttonLabels[kind], false); return; }
  let insertHtml = '';
  if (kind === 'solution') {
    insertHtml = '<div class="section solution"><h4>详细解答</h4><p>' + escapeHtml(mapped.solution).replace(/\n/g,'<br>') + '</p></div>';
  } else if (kind === 'methods') {
    insertHtml = '<div class="section methods"><h4>其他思路</h4><ul>' + mapped.methods.map(m => '<li>' + escapeHtml(m).replace(/\n/g,'<br>') + '</li>').join('') + '</ul></div>';
  } else if (kind === 'tip') {
    insertHtml = '<div class="section tip"><h4>备课提示</h4><p>' + escapeHtml(mapped.tip).replace(/\n/g, '<br>') + '</p></div>';
  } else if (kind === 'diagram') {
    const svg = svgFor(year, no);
    if (svg) insertHtml = '<div class="section diagram"><h4>参考图解</h4>' + svg + '</div>';
    else if (mapped.diagram) insertHtml = '<div class="section diagram"><h4>参考图解</h4><p style="text-align:left">' + escapeHtml(mapped.diagram) + '</p></div>';
  }
  if (insertHtml) { card.insertAdjacentHTML('beforeend', insertHtml); styleDisclosure(btn, buttonLabels[kind], true); }
};

function changePaperSelection() {
  state.singleNo = 1;
  singleNo.value = 1;
  syncPaperSelectors();
  render();
  app.scrollTop = 0;
}
gradeSel.addEventListener('change', e => { state.grade = e.target.value; state.year = 'all'; changePaperSelection(); });
yearSel.addEventListener('change', e => { state.year = e.target.value; changePaperSelection(); });
viewSel.addEventListener('change', e => {
  state.view = e.target.value;
  singleNo.style.display = state.view === 'single' ? 'inline-block' : 'none';
  render();
});
singleNo.addEventListener('input', e => { state.singleNo = Number(e.target.value); if (state.view === 'single') render(); });
search.addEventListener('input', e => { state.search = e.target.value; render(); });

btnToggleAns.addEventListener('click', () => {
  state.showAnswer = !state.showAnswer;
  btnToggleAns.textContent = state.showAnswer ? '隐藏所有答案' : '显示所有答案';
  btnToggleAns.className = state.showAnswer ? 'danger' : 'ok';
  render();
});
btnExpandSol.addEventListener('click', () => { state.showSolution = !state.showSolution; btnExpandSol.textContent = state.showSolution ? '收起全部详解' : '展开全部详解'; render(); });

btnToggleTags.addEventListener('click', () => {
  const opening = tagCloud.classList.contains('hidden');
  setOverflowOpen(false);
  tagCloud.classList.toggle('hidden', !opening);
  updateTagToggleButton();
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (overflowOpen()) { setOverflowOpen(false); overflowBtn.focus({preventScroll: true}); return; }
  if (!tagCloud.classList.contains('hidden')) {
    tagCloud.classList.add('hidden');
    updateTagToggleButton();
    btnToggleTags.focus({preventScroll: true});
  }
});

function cardQuestion(btn) {
  const card = btn.closest('.q-card');
  return {...KANGAROO_DATA[card.dataset.year].find(q => q.no === Number(card.dataset.no)), year: card.dataset.year};
}
const HINT_STORAGE = 'kangaroo-hints-v1';
let customHints = {};
try {
  const saved = JSON.parse(localStorage.getItem(HINT_STORAGE) || '{}');
  if (saved && typeof saved === 'object' && !Array.isArray(saved)) {
    for (const [key, value] of Object.entries(saved)) {
      if (Array.isArray(value) && value.length && value.every(h => typeof h === 'string' && h.trim())) customHints[key] = value;
    }
  }
} catch (_) { /* Default hints remain available when storage is unavailable. */ }
function hintsFor(q) { return customHints[questionKey(q)] || q.hints; }
const hintEditor = document.getElementById('hintEditor');
const hintFields = document.getElementById('hintFields');
let editingQuestion = null;
function addHintField(value = '') {
  const row = document.createElement('div'); row.className = 'hint-field';
  const label = document.createElement('label'); label.textContent = 'Hint（由浅到深）';
  const input = document.createElement('textarea'); input.value = value; input.required = true;
  label.appendChild(input); row.appendChild(label);
  const remove = document.createElement('button'); remove.type = 'button'; remove.className = 'secondary'; remove.textContent = '删除此条';
  remove.onclick = () => row.remove(); row.appendChild(remove); hintFields.appendChild(row);
}
window.editHints = function(btn) {
  if (state.mode !== 'teaching') return;
  editingQuestion = cardQuestion(btn); hintFields.replaceChildren();
  document.getElementById('hintEditorTitle').textContent = paperLabel(editingQuestion.year) + ' · Q' + editingQuestion.no + ' 编辑 Hint';
  document.getElementById('hintError').textContent = '';
  hintsFor(editingQuestion).forEach(addHintField); hintEditor.showModal();
};
document.getElementById('addHint').onclick = () => addHintField();
document.getElementById('cancelHints').onclick = () => hintEditor.close();
document.getElementById('hintForm').onsubmit = e => {
  e.preventDefault();
  const values = [...hintFields.querySelectorAll('textarea')].map(el => el.value.trim());
  if (!values.length || values.some(h => !h)) {
    document.getElementById('hintError').textContent = '请至少保留一条 Hint，且内容不能为空。'; return;
  }
  const updated = {...customHints, [questionKey(editingQuestion)]: values};
  try { localStorage.setItem(HINT_STORAGE, JSON.stringify(updated)); }
  catch (_) { document.getElementById('hintError').textContent = '浏览器无法保存，请允许网站存储后重试。编辑内容已保留。'; return; }
  customHints = updated; hintProgress.delete(questionKey(editingQuestion));
  hintEditor.close(); const top = app.scrollTop; render(); app.scrollTop = top;
};
function teachingHintSection(q) {
  return '<div class="section hint"><h4>全部 Hint</h4><ol>' + hintsFor(q).map(h => '<li>' + escapeHtml(h) + '</li>').join('') + '</ol><button class="secondary" onclick="editHints(this)">编辑 Hint</button></div>';
}
function hintSection(q, i) {
  return '<div class="section hint" role="status"><h4>Hint ' + (i + 1) + ' / ' + hintsFor(q).length + '</h4><p>' + escapeHtml(hintsFor(q)[i]).replace(/\n/g, '<br>') + '</p><small>由浅到深；全部看完后再次点击将回到第一条。</small></div>';
}
window.showHint = function(btn) {
  const q = cardQuestion(btn);
  if (state.mode === 'teaching') {
    const card = btn.closest('.q-card');
    if (teachingHints.has(questionKey(q))) {
      teachingHints.delete(questionKey(q)); closePanel(card.querySelector('.hint'), btn); styleDisclosure(btn, 'Hint', false);
    } else {
      teachingHints.add(questionKey(q));
      card.querySelector('.q-actions').insertAdjacentHTML('afterend', teachingHintSection(q));
      styleDisclosure(btn, 'Hint', true);
    }
    return;
  }
  const i = ((hintProgress.get(questionKey(q)) ?? -1) + 1) % hintsFor(q).length;
  if (!window.confirm('确认查看 Hint ' + (i + 1) + ' / ' + hintsFor(q).length + ' 吗？')) return;
  hintProgress.set(questionKey(q), i);
  const card = btn.closest('.q-card');
  const old = card.querySelector('.hint');
  if (old) old.remove();
  card.querySelector('.q-actions').insertAdjacentHTML('afterend', hintSection(q, i));
  styleDisclosure(btn, 'Hint', true);
  card.querySelector('.hint').scrollIntoView({block: 'nearest'});
};
window.chooseAnswer = function(btn) {
  const q = cardQuestion(btn);
  if (!q.answer) return;
  const card = btn.closest('.q-card');
  const letter = btn.dataset.letter;
  attempts.set(questionKey(q), letter);
  const reveal = state.mode === 'teaching' && card.querySelector('.q-actions button[onclick*="answer"]')?.getAttribute('aria-expanded') === 'true';
  card.querySelector('.options').innerHTML = Object.entries(q.options).filter(([, text]) => text).map(([key, text]) => optionCard(q, key, text, reveal)).join('');
  const feedback = card.querySelector('.feedback');
  const correct = letter === q.answer;
  feedback.className = 'feedback ' + (correct ? 'correct' : 'incorrect');
  feedback.textContent = correct ? '✅ 正确！' : '❌ 错误，再试一次。';
  card.querySelector('.option[data-letter="' + letter + '"]').focus({preventScroll: true});
};
document.getElementById('modeToggle').addEventListener('click', e => {
  state.mode = state.mode === 'teaching' ? 'practice' : 'teaching';
  const practice = state.mode === 'practice';
  state.showAnswer = state.showSolution = state.showMethods = state.showDiagram = false;
  btnToggleAns.hidden = btnExpandSol.hidden = practice;
  btnToggleAns.textContent = '显示所有答案'; btnToggleAns.className = 'ok';
  btnExpandSol.textContent = '展开全部详解';
  viewSel.querySelector('[value="answers"]').disabled = practice;
  viewSel.querySelector('[value="answers"]').hidden = practice;
  if (practice && state.view === 'answers') { state.view = 'list'; viewSel.value = 'list'; }
  e.currentTarget.textContent = practice ? '练习版' : '教学版';
  e.currentTarget.setAttribute('aria-pressed', String(practice));
  render();
});

syncPaperSelectors();
renderTagCloud();
render();
</script>
